name: publish-plugin
run-name: Publish
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    name: Publish plugin
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: modified
    - name: Build
      shell: bash
      run: git archive --format=zip --prefix="fast-velocity-minify/" HEAD > ${{ github.workspace }}/fast-velocity-minify.zip
    - name: Upload zip file to GitHub actions artifact
      uses: actions/upload-artifact@v4
      with:
        name: fast-velocity-minify.zip
        path: ${{ github.workspace }}/fast-velocity-minify.zip
    - name: Resolve release tag
      id: release_tag
      shell: bash
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAG="${{ github.ref_name }}"
        else
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Upload zip to release via gh (overwrite)
      if: ${{ steps.release_tag.outputs.tag != '' }}
      shell: bash
      run: |
        TAG="${{ steps.release_tag.outputs.tag }}"
        gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --notes "Release $TAG"
        gh release upload "$TAG" "${{ github.workspace }}/fast-velocity-minify.zip" --clobber
      env:
        GH_TOKEN: ${{ github.token }}
