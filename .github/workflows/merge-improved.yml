name: merge-and-build-improved
run-name: Merge and Build improved-long-term-page-caching
permissions:
  contents: write
on:
  workflow_run:
    workflows: ["publish-plugin"]
    types:
      - completed
  workflow_dispatch:
jobs:
  merge-and-build:
    name: Merge modified into improved-long-term-page-caching and build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout improved-long-term-page-caching
      uses: actions/checkout@v4
      with:
        ref: improved-long-term-page-caching
        fetch-depth: 0
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    - name: Merge modified branch
      run: |
        git fetch origin modified
        git merge origin/modified --no-edit
        git push origin improved-long-term-page-caching
    - name: Build release archive
      shell: bash
      run: git archive --format=zip --prefix="fast-velocity-minify/" HEAD > "${{ github.workspace }}/fast-velocity-minify-improved.zip"
    - name: Resolve release tag
      id: release_tag
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
          TAG="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n1)"
        else
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Upload archive to release via gh (overwrite)
      if: ${{ steps.release_tag.outputs.tag != '' }}
      shell: bash
      run: |
        TAG="${{ steps.release_tag.outputs.tag }}"
        gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --notes "Release $TAG"
        gh release upload "$TAG" "${{ github.workspace }}/fast-velocity-minify-improved.zip" --clobber
      env:
        GH_TOKEN: ${{ github.token }}
